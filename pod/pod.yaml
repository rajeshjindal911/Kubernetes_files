apiVersion: v1
kind: Pod
metadata:
    name: web-app
      labels:
            app: web
            spec:
                containers:
                      - name: web-container
                            image: nginx:latest
                                  ports:
                                            - containerPort: 80
                                                  resources:
                                                            limits:
                                                                        memory: "512Mi"
                                                                                  cpu: "500m"
